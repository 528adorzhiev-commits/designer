<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ikko Tanaka Inspired Nav</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg tanaka-nav">
        <div class="container-fluid p-0">
          
          <a class="navbar-brand tanaka-brand" href="#">

            <span class="toggler-box"></span>
          </button>

          <div class="collapse navbar-collapse" id="tanakaNavbar">
            <div class="navbar-nav ms-auto tanaka-menu">
              <a class="nav-link active" aria-current="page" href="#">INTRODUCTION</a>
              <a class="nav-link" href="#">BIOGRAPHY</a>
              <a class="nav-link" href="#">STYLE</a>
              <a class="nav-link" href="#">GALLERY</a>

        </div>
      </nav>
    </header>

    <main class="container my-5">
      <h1 class="tanaka-heading">IKKO TANAKA</h1>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
